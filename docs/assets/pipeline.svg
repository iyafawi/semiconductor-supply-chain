<line x1="494" y1="597" x2="494" y2="658" stroke="#2b414f"/>
<line x1="944" y1="597" x2="944" y2="658" stroke="#2b414f"/>
<text x="72" y="612" fill="#dce8ef" font-size="18" font-weight="600">Scheduled collection</text>
<text x="72" y="643" fill="#95aebf" font-size="16">On startup, then ~10 min between cycles</text>
