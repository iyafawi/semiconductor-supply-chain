<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
<title id="title">Silicon Watch: from news to supplier exposure</title>
<desc id="desc">Four stages run left to right: discover reports using OpenAI web search and external feeds; normalize and validate records before storing articles in SQL Server; filter relevance, match suppliers, cluster reports and store scored events; serve results through FastAPI to a React dashboard with supplier analysis and simulations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#6f93a7" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="730" rx="24" fill="#0d1721"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="48" y="48" fill="#73d8bf" font-size="15" font-weight="700" letter-spacing="3">SILICON WATCH / SYSTEM PIPELINE</text>
<text x="48" y="99" fill="#f0f5f8" font-size="34" font-weight="650">From news to supplier exposure</text>
<text x="48" y="133" fill="#9fb2c0" font-size="20">A source-linked path from incoming reports to component coverage analysis.</text>

<rect x="48" y="177" width="318" height="366" rx="15" fill="#152431" stroke="#2c414f"/>
<rect x="48" y="177" width="318" height="4" rx="2" fill="#75c9fc"/>
