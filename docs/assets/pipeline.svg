<text x="754" y="217" fill="#b4a0fa" font-size="14" font-weight="700" letter-spacing="2">03 / ASSESS</text>
<text x="754" y="253" fill="#eff5f8" font-size="21" font-weight="600">Connect news to suppliers</text>
