<text x="70" y="253" fill="#eff5f8" font-size="21" font-weight="600">Find current reports</text>
<circle cx="73" cy="285" r="3" fill="#75c9fc"/>
<text x="88" y="290" fill="#dfebf1" font-size="18" font-weight="600">OpenAI web search</text>
<text x="88" y="314" fill="#9fb4c3" font-size="15">Cited news discovery</text>
<circle cx="73" cy="353" r="3" fill="#75c9fc"/>
<text x="88" y="358" fill="#dfebf1" font-size="18" font-weight="600">Industry RSS</text>
<text x="88" y="382" fill="#9fb4c3" font-size="15">Semiconductor reporting</text>
<circle cx="73" cy="421" r="3" fill="#75c9fc"/>
<text x="88" y="426" fill="#dfebf1" font-size="18" font-weight="600">USGS + Federal Register</text>
<text x="88" y="450" fill="#9fb4c3" font-size="15">Earthquakes and trade rules</text>
<line x1="70" y1="487" x2="344" y2="487" stroke="#304451"/>
<text x="70" y="518" fill="#75c9fc" font-size="15">Python collection worker</text>
