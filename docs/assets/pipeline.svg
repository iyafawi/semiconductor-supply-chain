<rect x="390" y="177" width="318" height="366" rx="15" fill="#152431" stroke="#2c414f"/>
<rect x="390" y="177" width="318" height="4" rx="2" fill="#74ddc0"/>
<text x="412" y="217" fill="#74ddc0" font-size="14" font-weight="700" letter-spacing="2">02 / PREPARE</text>
<text x="412" y="253" fill="#eff5f8" font-size="21" font-weight="600">Make records usable</text>
<circle cx="415" cy="285" r="3" fill="#74ddc0"/>
<text x="430" y="290" fill="#dfebf1" font-size="18" font-weight="600">Normalize</text>
<text x="430" y="314" fill="#9fb4c3" font-size="15">Clean text, URLs and dates</text>
<circle cx="415" cy="353" r="3" fill="#74ddc0"/>
<text x="430" y="358" fill="#dfebf1" font-size="18" font-weight="600">Validate</text>
<text x="430" y="382" fill="#9fb4c3" font-size="15">Check citations and freshness</text>
<circle cx="415" cy="421" r="3" fill="#74ddc0"/>
<text x="430" y="426" fill="#dfebf1" font-size="18" font-weight="600">Archive articles</text>
<text x="430" y="450" fill="#9fb4c3" font-size="15">SQL Server + stable article IDs</text>
<line x1="412" y1="487" x2="686" y2="487" stroke="#304451"/>
<text x="412" y="518" fill="#74ddc0" font-size="15">Retain evidence before filtering</text>
<path d="M712 361 H728" stroke="#6f93a7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="732" y="177" width="318" height="366" rx="15" fill="#152431" stroke="#2c414f"/>
