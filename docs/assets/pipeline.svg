<circle cx="757" cy="421" r="3" fill="#b4a0fa"/>
<text x="772" y="426" fill="#dfebf1" font-size="18" font-weight="600">Persist results</text>
<text x="772" y="450" fill="#9fb4c3" font-size="15">SQL Server events and risk history</text>
<line x1="754" y1="487" x2="1028" y2="487" stroke="#304451"/>
<text x="754" y="518" fill="#b4a0fa" font-size="15">Explain each match and score</text>
