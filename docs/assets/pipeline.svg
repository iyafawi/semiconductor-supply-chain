<text x="1096" y="217" fill="#f0bd79" font-size="14" font-weight="700" letter-spacing="2">04 / EXPLORE</text>
<text x="1096" y="253" fill="#eff5f8" font-size="21" font-weight="600">Inspect supply dependencies</text>
<circle cx="1099" cy="285" r="3" fill="#f0bd79"/>
<text x="1114" y="290" fill="#dfebf1" font-size="18" font-weight="600">FastAPI</text>
<text x="1114" y="314" fill="#9fb4c3" font-size="15">Serve records and risk calculations</text>
<circle cx="1099" cy="353" r="3" fill="#f0bd79"/>
<text x="1114" y="358" fill="#dfebf1" font-size="18" font-weight="600">React dashboard</text>
<text x="1114" y="382" fill="#9fb4c3" font-size="15">Map, suppliers and source links</text>
<circle cx="1099" cy="421" r="3" fill="#f0bd79"/>
<text x="1114" y="426" fill="#dfebf1" font-size="18" font-weight="600">Disruption simulation</text>
<text x="1114" y="450" fill="#9fb4c3" font-size="15">Remove suppliers; check coverage</text>
<line x1="1096" y1="487" x2="1370" y2="487" stroke="#304451"/>
<text x="1096" y="518" fill="#f0bd79" font-size="15">Review evidence and alternatives</text>
